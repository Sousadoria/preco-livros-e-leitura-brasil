<text x="58" y="132" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172d3d">Preço médio no varejo</text>
<text x="58" y="156" font-family="Arial,sans-serif" font-size="13" fill="#596773">R$ por exemplar • Nielsen BookScan</text>
