<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Dois indicadores do projeto: preço de varejo e leitores no Brasil</title>
<desc id="desc">O preço médio varejista sobe de 41,28 reais em 2021 para 50,66 em 2024. A estimativa de leitores cai de 100,1 milhões em 2019 para 93,4 milhões em 2024.</desc>
