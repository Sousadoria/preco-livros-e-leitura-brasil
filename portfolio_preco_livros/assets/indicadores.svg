<text x="104" y="393" font-family="Arial,sans-serif" font-size="12" fill="#596773">2021</text><text x="200" y="393" font-family="Arial,sans-serif" font-size="12" fill="#596773">2022</text><text x="296" y="393" font-family="Arial,sans-serif" font-size="12" fill="#596773">2023</text><text x="392" y="393" font-family="Arial,sans-serif" font-size="12" fill="#596773">2024</text>
